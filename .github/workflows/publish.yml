name: publish

# Called by ci.yml once the smoke test has passed (publish, promote) and by dry-run.yml (dry
# run), never triggered on its own. The caller decides the token's permissions: the dry run
# gets no packages: write.
#   push: false           dry run (PRs into main): build both platforms, check, push nothing
#   push: true            publish (main): push <image>:<version> unless it already exists
#   level_tag: level-NN-… promote (level tags): give <image>:<version> the level tag, same digest
on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      push: { type: boolean, required: true }
      level_tag: { type: string, default: "" }

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    if: inputs.level_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # one failed service must not cancel the others; a re-run finishes the rest
      matrix:
        include: &images # every published image, and the directory it builds from
          - { service: go, context: backends/go }
          - { service: python, context: backends/python }
          - { service: rust, context: backends/rust }
          - { service: ts, context: backends/ts }
          - { service: frontend, context: frontend }
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.service }}
      SERVICE: ${{ matrix.service }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      - if: inputs.push
        env: { TOKEN: "${{ github.token }}" }
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Tags are immutable: an image that is already published is never rebuilt or overwritten,
      # and one that exists but was built from another commit stops the run.
      - id: guard
        if: inputs.push
        run: |
          existing=$(scripts/image-digest.sh --revision "$GITHUB_SHA" "$IMAGE:$VERSION")
          if [ -n "$existing" ]; then
            echo "$IMAGE:$VERSION already exists ($existing): skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      # A registry on the runner: the image is built once into it, checked from it, and only
      # then copied to GHCR, so what ships is byte-for-byte what was checked.
      - if: steps.guard.outputs.skip != 'true'
        run: docker run -d -p 5000:5000 registry:2
      - if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - if: steps.guard.outputs.skip != 'true'
        env: { PUSH: "${{ inputs.push }}" }
        run: |
          push=()
          [ "$PUSH" = true ] && push=(--push)
          scripts/build-image.sh "$SERVICE" "$CONTEXT" "$IMAGE" "$VERSION" "$GITHUB_SHA" "${push[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  promote:
    if: inputs.level_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30 # longer than promote.sh's 20-minute wait for main's publish
    strategy:
      fail-fast: false
      matrix:
        include: *images
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.service }}
      LEVEL_TAG: ${{ inputs.level_tag }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 0 }

      # Only main's own commits (its first-parent line) are published as sha-<7>, so a level tag
      # anywhere else, a dev or feature commit included, fails here instead of waiting.
      - run: |
          git rev-list --first-parent origin/main >main-commits
          grep -qx "$GITHUB_SHA" main-commits \
            || { echo "::error::$LEVEL_TAG is on ${GITHUB_SHA::7}, which isn't one of main's own commits: tag main's merge commit"; exit 1; }

      - env: { TOKEN: "${{ github.token }}" }
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - run: scripts/promote.sh "$IMAGE" "$VERSION" "$LEVEL_TAG" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
