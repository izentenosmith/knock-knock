# One of four backend Deployments. The pool: knock label puts its pod behind the one Service,
# knock-api; app: knock-go is only this Deployment's own selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knock-go
spec:
  replicas: 1
  selector:
    matchLabels: { app: knock-go }
  template:
    metadata:
      labels: { app: knock-go, pool: knock }
    spec:
      containers:
        - name: go
          image: ghcr.io/izentenosmith/knock-knock-go:sha-04f74b3
          ports:
            - containerPort: 8080
          env: # the Downward API: which pod answered, and on which node
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              value: local
