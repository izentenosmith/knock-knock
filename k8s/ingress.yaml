# Everything enters through k3d's Traefik and goes to the frontend; /api/ continues through its
# nginx to knock-api. Nothing routes to the backends directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knock
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 8080 }
