# Full nginx.conf (replaces the image default) so nginx can run as a non-root user.
worker_processes 1; # one worker = one round-robin counter, so the rotation is exact
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolved once, at startup: every address knock-api has then joins the round robin.
    location /api/ {
      proxy_pass http://knock-api:8080;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
